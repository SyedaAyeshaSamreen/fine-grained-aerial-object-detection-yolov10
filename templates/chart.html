        <body>
            <h1>Chart  Analysis</h1>
        
            <div class="chart-container">
                <!-- Pie Chart -->
                <div class="chart-card">
                    <h2>Debris Distribution</h2>
                    <canvas id="pieChart" class="debris_distribution"></canvas>
                </div>
        
                <!-- Bar Chart -->
                <div class="chart-card">
                    <h2>Debris Count</h2>
                    <canvas id="barChart" class="debris_count"></canvas>
                </div>
        
                <!-- Additional Charts -->
                <div class="chart-card">
                    <h2>Debris Size Trends</h2>
                    <canvas id="sizeChart" class="debris_size"></canvas>
                </div>
        
                <div class="chart-card">
                    <h2>Debris Material Analysis</h2>
                    <canvas id="materialChart" class="debris_material"></canvas>
                </div>
            </div>
        
            <script>
    const classLabels = [
        'Expressway-Service-area', 'Expressway-toll-station', 'airplane', 'airport', 'baseballfield',
        'basketballcourt', 'bridge', 'chimney', 'dam', 'golffield',
        'groundtrackfield', 'harbor', 'overpass', 'ship', 'stadium',
        'storagetank', 'tenniscourt', 'trainstation', 'vehicle', 'windmill'
    ];

    const pieCtx = document.getElementById('pieChart').getContext('2d');
    new Chart(pieCtx, {
        type: 'pie',
        data: {
            labels: classLabels,
            datasets: [{
                label: 'Object Distribution',
                data: [12, 9, 15, 10, 8, 6, 7, 5, 13, 11, 10, 6, 9, 12, 8, 7, 6, 5, 14, 9],
                backgroundColor: [
                    '#ff6384', '#36a2eb', '#ffcd56', '#4bc0c0', '#9966ff',
                    '#ff9f40', '#c9cbcf', '#4b0082', '#800080', '#ff4500',
                    '#2e8b57', '#4682b4', '#ffa500', '#20b2aa', '#8b0000',
                    '#556b2f', '#ff6347', '#6a5acd', '#ff1493', '#00ced1'
                ],
                borderWidth: 1
            }]
        }
    });

    const barCtx = document.getElementById('barChart').getContext('2d');
    new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: classLabels,
            datasets: [{
                label: 'Object Count',
                data: [20, 18, 25, 22, 19, 15, 17, 12, 21, 16, 14, 13, 20, 23, 18, 15, 14, 10, 27, 19],
                backgroundColor: [
                    '#ff6384', '#36a2eb', '#ffcd56', '#4bc0c0', '#9966ff',
                    '#ff9f40', '#c9cbcf', '#4b0082', '#800080', '#ff4500',
                    '#2e8b57', '#4682b4', '#ffa500', '#20b2aa', '#8b0000',
                    '#556b2f', '#ff6347', '#6a5acd', '#ff1493', '#00ced1'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    const sizeCtx = document.getElementById('sizeChart').getContext('2d');
    new Chart(sizeCtx, {
        type: 'line',
        data: {
            labels: classLabels,
            datasets: [{
                label: 'Average Size (cm)',
                data: [50, 60, 55, 70, 65, 58, 52, 45, 63, 67, 62, 59, 68, 74, 64, 60, 58, 56, 75, 66],
                borderColor: '#ffcd56',
                backgroundColor: 'rgba(255, 205, 86, 0.2)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    const materialCtx = document.getElementById('materialChart').getContext('2d');
    new Chart(materialCtx, {
        type: 'radar',
        data: {
            labels: classLabels.slice(0, 10),  // only first 10 for readability
            datasets: [{
                label: 'Material Impact Score',
                data: [80, 70, 65, 60, 75, 85, 78, 55, 68, 72],
                backgroundColor: 'rgba(75,192,192,0.4)',
                borderColor: '#4bc0c0',
                pointBackgroundColor: '#4bc0c0'
            }]
        },
        options: {
            responsive: true,
            scales: {
                r: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
